<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Planner - App</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #FAFAF8;
            color: #4A4A48;
        }

        body {
            padding-bottom: 70px;
        }

        body.modal-open {
            overflow: hidden;
        }

        .app-header {
            background: white;
            padding: 16px 20px;
            border-bottom: 1px solid #E5E5E3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .logout-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #4A4A48;
        }

        .logout-btn:hover {
            color: #D4A5A5;
        }

        #appContent {
            padding: 16px 20px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid #E5E5E3;
            overflow-x: auto;
        }

        .tab {
            background: none;
            border: none;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #8A8A88;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: #4A4A48;
            border-bottom-color: #D4A5A5;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .filter-btn {
            background: #F5F3F0;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #8A8A88;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #D4A5A5;
            color: white;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            background: white;
            border: 1px solid #E5E5E3;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-item:hover {
            background: #F8E8E8;
            border-color: #D4A5A5;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #8A8A88;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .task-meta {
            font-size: 12px;
            color: #8A8A88;
        }

        .badge {
            display: inline-block;
            background: #F8E8E8;
            color: #D4A5A5;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 4px;
        }

        .task-item-compact {
            background: white;
            border: 1px solid #E5E5E3;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
        }

        .task-item-compact.completed {
            opacity: 0.5;
        }

        .task-item-compact.completed span {
            text-decoration: line-through;
        }

        .week-view {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .week-day {
            background: white;
            border: 1px solid #E5E5E3;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
        }

        .day-header {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: #4A4A48;
        }

        .day-tasks {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .empty-small {
            font-size: 12px;
            color: #E5E5E3;
            text-align: center;
        }

        .month-view {
            background: white;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #E5E5E3;
        }

        .month-header {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day-label {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #8A8A88;
            padding: 8px 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid #E5E5E3;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            background: #F8E8E8;
            border-color: #D4A5A5;
        }

        .calendar-day.empty {
            cursor: default;
            background: #F5F3F0;
        }

        .calendar-day.empty:hover {
            background: #F5F3F0;
            border-color: #E5E5E3;
        }

        .calendar-day.today {
            background: #D4A5A5;
            color: white;
            border-color: #D4A5A5;
        }

        .day-num {
            font-weight: 600;
        }

        .day-count {
            font-size: 10px;
            color: #8A8A88;
        }

        .calendar-day.today .day-count {
            color: rgba(255, 255, 255, 0.7);
        }

        .content-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .content-item {
            background: white;
            border: 1px solid #E5E5E3;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .content-item:hover {
            background: #F8E8E8;
            border-color: #D4A5A5;
        }

        .content-header {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
        }

        .content-header strong {
            flex: 1;
            font-size: 14px;
        }

        .status {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .content-meta {
            font-size: 12px;
            color: #8A8A88;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: #8A8A88;
            font-size: 14px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #E5E5E3;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 200;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #8A8A88;
            transition: all 0.2s;
        }

        .nav-btn.active {
            color: #D4A5A5;
        }

        .floating-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #D4A5A5;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(212, 165, 165, 0.3);
            z-index: 150;
        }

        .floating-btn:active {
            transform: scale(0.95);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 16px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4A4A48;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #E5E5E3;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #D4A5A5;
            box-shadow: 0 0 0 3px rgba(212, 165, 165, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4A4A48;
            color: white;
        }

        .btn-primary:hover {
            background: #3A3A38;
        }

        .btn-secondary {
            background: #F8E8E8;
            color: #4A4A48;
        }

        .btn-secondary:hover {
            background: #F0E0E0;
        }

        .btn-danger {
            background: #E8A8A8;
            color: white;
        }

        .btn-danger:hover {
            background: #D89898;
        }

        .floating-menu {
            position: fixed;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            z-index: 999;
            min-width: 160px;
        }

        .floating-menu button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            color: #4A4A48;
            text-align: left;
            transition: all 0.2s;
            font-weight: 500;
        }

        .floating-menu button:first-child {
            border-radius: 12px 12px 0 0;
        }

        .floating-menu button:last-child {
            border-radius: 0 0 12px 12px;
        }

        .floating-menu button:hover {
            background: #F8E8E8;
        }

        @media (max-width: 600px) {
            .modal {
                border-radius: 12px 12px 0 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>📋 Meu Planner</h1>
        <button class="logout-btn" onclick="handleLogout()" title="Sair">↗</button>
    </div>

    <div id="appContent"></div>

    <button class="floating-btn" id="floatingBtn">+</button>

    <div class="nav-bar">
        <button class="nav-btn active" data-area="minha-agenda" onclick="switchArea('minha-agenda')">📅 Agenda</button>
        <button class="nav-btn" data-area="gestao" onclick="switchArea('gestao')">📊 Gestão</button>
        <button class="nav-btn" data-area="masya" onclick="switchArea('masya')">✨ MASYA</button>
    </div>

    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
